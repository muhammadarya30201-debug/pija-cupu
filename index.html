<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Spesial Buat Pija ❤️</title>
    <style>
        html, body {
            margin: 0; padding: 0;
            width: 100%; height: 100%;
            overflow: hidden;
            background-color: #fff0f3;
        }
        iframe {
            width: 100%; height: 100%;
            border: none;
        }
        .music-overlay {
            position: fixed;
            top: 0; left: 0; width: 100%; height: 100%;
            background: #ffe5ec;
            display: flex; flex-direction: column;
            align-items: center; justify-content: center;
            z-index: 9999;
            font-family: 'Segoe UI', sans-serif;
            transition: opacity 0.5s ease;
        }
        .play-btn {
            background: linear-gradient(135deg, #ff758f 0%, #ff477e 100%);
            color: white; border: none;
            padding: 15px 40px; font-size: 18px; font-weight: bold;
            border-radius: 50px; cursor: pointer;
            box-shadow: 0 5px 15px rgba(255, 71, 126, 0.4);
        }
    </style>
</head>
<body>

    <div id="musicOverlay" class="music-overlay">
        <div style="font-size: 3.5rem; margin-bottom: 20px;">💌</div>
        <h2 style="color: #590d22; margin-bottom: 20px; font-size: 1.2rem; text-align:center; padding:0 20px;">Ada pesan spesial nih buat Pija! Balikkin HP-nya dulu yaa..</h2>
        <button class="play-btn" id="btnBuka" onclick="startEverything()">Buka Pesan ✨</button>
    </div>

    <audio id="bgMusic" loop preload="auto">
       <source src="music-pija.mp3" type="audio/mpeg">
    </audio>

    <iframe src="opening.html" id="gameWindow" allow="autoplay"></iframe>

    <script>
        // Trik memaksa audio siap di latar belakang sebelum diklik
        window.addEventListener('DOMContentLoaded', () => {
            const music = document.getElementById('bgMusic');
            music.load(); 
        });

        function startEverything() {
            const music = document.getElementById('bgMusic');
            
            // Coba putar musik secara paksa
            let playPromise = music.play();

            if (playPromise !== undefined) {
                playPromise.then(_ => {
                    // Musik sukses diputar, hilangkan penutup overlay
                    hilangkanOverlay();
                }).catch(error => {
                    console.log("Autoplay gagal, mencoba alternatif sentuhan ulang...", error);
                    // Jika browser galak memblokir, dicoba putar sekali lagi dalam jeda milidetik
                    setTimeout(() => {
                        music.play();
                        hilangkanOverlay();
                    }, 100);
                });
            }
        }

        function hilangkanOverlay() {
            const overlay = document.getElementById('musicOverlay');
            overlay.style.opacity = '0';
            setTimeout(() => { overlay.style.display = 'none'; }, 500);
        }
    </script>
</body>
</html>
